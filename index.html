<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Avaliação da Festa Julina 2026 — EM Regina Celi</title>
<style>
  :root{
    --navy:#1F3864; --navy-dark:#152647; --gold:#B08D57; --teal:#2E7D6B;
    --bg:#F4F6FA; --card:#FFFFFF; --line:#E1E6EF; --text:#243044; --muted:#6B7688;
    --danger:#C0392B; --ok:#2E7D32;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);}
  .topbar{background:linear-gradient(135deg,var(--navy),var(--navy-dark));color:#fff;padding:22px 18px 26px;text-align:center;}
  .topbar h1{margin:0 0 4px;font-size:20px;letter-spacing:.3px;}
  .topbar p{margin:0;font-size:13px;color:#C9D4E8;}
  .accounts-link{
    display:inline-flex;align-items:center;gap:6px;margin-top:12px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);
    color:#fff;text-decoration:none;font-size:12.5px;font-weight:bold;
    padding:8px 14px;border-radius:20px;transition:background .15s ease;
  }
  .accounts-link:hover{background:rgba(255,255,255,.22);}
  .wrap{max-width:640px;margin:-14px auto 40px;padding:0 14px;}
  .card{background:var(--card);border-radius:14px;box-shadow:0 6px 20px rgba(20,30,60,.08);padding:22px 18px;margin-bottom:16px;}
  .progress-wrap{max-width:640px;margin:0 auto;padding:0 14px;}
  .progress-track{height:8px;background:#dfe4ee;border-radius:6px;overflow:hidden;margin-top:14px;}
  .progress-fill{height:100%;background:var(--gold);width:0%;transition:width .3s ease;}
  .progress-label{color:#C9D4E8;font-size:11px;margin-top:6px;text-align:center;}
  h2.step-title{font-size:17px;color:var(--navy);margin:0 0 4px;}
  p.step-sub{font-size:13px;color:var(--muted);margin:0 0 18px;}
  label.field-label{display:block;font-size:13px;font-weight:bold;color:var(--navy);margin:14px 0 6px;}
  input[type=text], select, textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;
    font-size:15px;font-family:inherit;color:var(--text);background:#fff;
  }
  textarea{resize:vertical;min-height:70px;}
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--teal);}
  .required-mark{color:var(--danger);}
  .env-card{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;}
  .env-card h3{margin:0 0 2px;font-size:14.5px;color:var(--navy);}
  .env-card .env-desc{font-size:12px;color:var(--muted);margin:0 0 10px;}
  .rating-row{display:flex;gap:6px;justify-content:space-between;}
  .rating-btn{
    flex:1;border:1.5px solid var(--line);background:#fff;border-radius:9px;
    padding:9px 2px;text-align:center;cursor:pointer;font-size:20px;line-height:1;
    transition:all .15s ease;user-select:none;
  }
  .rating-btn .num{display:block;font-size:10px;color:var(--muted);margin-top:3px;font-weight:bold;}
  .rating-btn.selected{border-color:var(--teal);background:#E6F3F0;transform:scale(1.05);}
  .rating-btn.selected .num{color:var(--teal);}
  .btn-row{display:flex;gap:10px;margin-top:20px;}
  button.nav-btn{
    flex:1;padding:13px;border-radius:9px;border:none;font-size:15px;font-weight:bold;
    cursor:pointer;font-family:inherit;
  }
  button.btn-primary{background:var(--navy);color:#fff;}
  button.btn-primary:disabled{background:#AEB8CC;cursor:not-allowed;}
  button.btn-secondary{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
  .error-msg{color:var(--danger);font-size:12.5px;margin-top:8px;display:none;}
  .review-block{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  .review-block:last-child{border-bottom:none;}
  .review-block .rlabel{font-size:12px;color:var(--muted);font-weight:bold;text-transform:uppercase;letter-spacing:.4px;}
  .review-block .rvalue{font-size:14.5px;margin-top:2px;}
  .success-screen{text-align:center;padding:40px 20px;}
  .success-screen .check{font-size:52px;margin-bottom:10px;}
  .success-screen h2{color:var(--navy);margin-bottom:8px;}
  .success-screen p{color:var(--muted);font-size:14px;}
  .loading-screen{text-align:center;padding:60px 20px;color:var(--muted);}
  .footer-note{text-align:center;font-size:11px;color:var(--muted);margin-top:6px;}
  /* Painel */
  .painel-wrap{max-width:920px;margin:0 auto;padding:20px 14px 40px;}
  .painel-login{max-width:340px;margin:60px auto;text-align:center;}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;}
  .kpi{background:#fff;border-radius:10px;padding:14px;text-align:center;box-shadow:0 3px 10px rgba(20,30,60,.06);}
  .kpi .kpi-num{font-size:22px;font-weight:bold;color:var(--navy);}
  .kpi .kpi-label{font-size:11px;color:var(--muted);margin-top:2px;}
  table.resp-table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:12.5px;}
  table.resp-table th{background:var(--navy);color:#fff;padding:8px 6px;text-align:left;position:sticky;top:0;}
  table.resp-table td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.resp-table tr:hover{background:#F7F9FC;}
  .table-scroll{overflow-x:auto;border-radius:10px;box-shadow:0 3px 10px rgba(20,30,60,.06);}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:bold;}
  .badge-5{background:#E2F3E5;color:var(--ok);}
  .badge-4{background:#E2F3E5;color:var(--ok);}
  .badge-3{background:#FFF3CD;color:#8a6d00;}
  .badge-2{background:#FBE1DE;color:var(--danger);}
  .badge-1{background:#FBE1DE;color:var(--danger);}
  .export-btn{background:var(--teal);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;margin-bottom:14px;}
  .comment-cell{max-width:220px;white-space:pre-wrap;color:var(--muted);font-style:italic;}
</style>
</head>
<body>

<div id="root"></div>

<!-- Fallback de CDN: jsdelivr costuma ser bloqueado na rede da escola, então tentamos
     jsdelivr primeiro e caímos para unpkg automaticamente se falhar. -->
<script>
  function loadSupabase(cb){
    var s1 = document.createElement('script');
    s1.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js";
    s1.onload = cb;
    s1.onerror = function(){
      var s2 = document.createElement('script');
      s2.src = "https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.js";
      s2.onload = cb;
      s2.onerror = function(){
        document.getElementById('root').innerHTML =
          '<div style="padding:40px;text-align:center;font-family:Arial;color:#C0392B;">' +
          'Não foi possível carregar a biblioteca do Supabase. Verifique sua conexão com a internet ' +
          'e tente novamente (em algumas redes escolares, é preciso usar dados móveis).</div>';
      };
      document.head.appendChild(s2);
    };
    document.head.appendChild(s1);
  }
  function waitForSupabaseGlobal(cb, tries){
    tries = tries || 0;
    if (window.supabase && window.supabase.createClient) { cb(); return; }
    if (tries > 100) {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;text-align:center;font-family:Arial;color:#C0392B;">' +
        'A biblioteca do Supabase demorou demais para carregar. Recarregue a página.</div>';
      return;
    }
    setTimeout(function(){ waitForSupabaseGlobal(cb, tries + 1); }, 100);
  }
</script>

<script>
// =========================================================================
// CONFIGURAÇÃO SUPABASE
// Reutiliza o mesmo projeto Supabase já usado em outros formulários da
// escola (rcsc-inclusao). Só é necessário rodar o SQL da tabela nova
// (ver supabase/schema.sql) uma única vez no SQL Editor do Supabase.
// =========================================================================
var SUPABASE_URL = "https://vjxsvcohipeyepfbkmro.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_gn6TBJ888I6cT137tPc3DA_-Biu4ipo";
var TABLE_NAME = "avaliacao_festa_junina";
var PAINEL_SENHA = "cerdeira2026";

// Link para a planilha de prestação de contas da festa. O arquivo deve ser
// enviado para o MESMO repositório do GitHub, na raiz, com este nome exato
// (ver instruções no README). Se preferir outro nome, ajuste aqui.
// Link para o PDF com apenas o Resumo Geral da prestação de contas da festa.
// O arquivo deve ser enviado para o MESMO repositório do GitHub, na raiz,
// com este nome exato (ver instruções no README).
var PRESTACAO_CONTAS_URL = "resumo-geral-festa-junina-2026.pdf";

var sbClient = null;

var FUNCOES = [
  "Diretor(a)", "Orientador(a) Pedagógico(a)", "Orientador(a) Educacional",
  "Psicólogo(a) Escolar", "Professor(a) Regente", "Professor(a) de AEE",
  "Professor(a) de Classe Especial", "Mediador(a) / Monitor(a)",
  "Secretaria", "ASG / Apoio", "Porteiro(a)", "Outro"
];

var AMBIENTES = [
  { key: "quadra", nome: "Quadra Esportiva", desc: "Apresentações artísticas das turmas" },
  { key: "estacionamento", nome: "Estacionamento", desc: "Venda de comidas e bebidas" },
  { key: "parquinho", nome: "Parquinho", desc: "Brincadeiras e brinquedos" },
  { key: "auditorio", nome: "Auditório", desc: "Homenagens a famílias e professores" },
  { key: "feira_meio", nome: "Feira do Meio", desc: "Divulgação e venda de produtos da comunidade" }
];

var HORARIOS = [
  { key: "horario1", label: "10h às 12h", turmas: "3º, 4º e 5º ano (qualidade)" },
  { key: "horario2", label: "12h às 14h", turmas: "Classes especiais e 2º ano (qualidade)" },
  { key: "horario3", label: "14h às 15h30", turmas: "Educação Infantil e 1º ano (qualidade)" }
];

var RATING_FACES = ["😟", "🙁", "😐", "🙂", "😄"];
var RATING_LABELS_SHORT = ["Ruim", "Fraco", "Regular", "Bom", "Ótimo"];

// ---------------------------------------------------------------------
// Estado do formulário
// ---------------------------------------------------------------------
var state = {
  step: 0,
  data: {
    nome: "",
    funcao: "",
    turma_setor: "",
    nota_geral: 0,
    ambientes: {}, // key -> {nota, comentario}
    horarios: {},  // key -> nota
    inclusao_nota: 0,
    inclusao_comentario: "",
    organizacao_nota: 0,
    comunicacao_nota: 0,
    pontos_positivos: "",
    pontos_melhorar: "",
    sugestoes: ""
  },
  submitting: false,
  submitted: false,
  submitError: ""
};

AMBIENTES.forEach(function(a){ state.data.ambientes[a.key] = { nota: 0, comentario: "" }; });
HORARIOS.forEach(function(h){ state.data.horarios[h.key] = 0; });

var TOTAL_STEPS = 8; // 0..7

function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs){
    if (attrs[k] === null || attrs[k] === undefined) continue;
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.indexOf("on") === 0) e.addEventListener(k.substring(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(function(c){
    if (c == null) return;
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

function ratingWidget(currentVal, onSelect){
  var row = el("div", { class: "rating-row" });
  for (var i = 1; i <= 5; i++){
    (function(i){
      var btn = el("div", {
        class: "rating-btn" + (currentVal === i ? " selected" : ""),
        onclick: function(){ onSelect(i); }
      }, [
        el("span", {}, [RATING_FACES[i - 1]]),
        el("span", { class: "num" }, [i + " " + RATING_LABELS_SHORT[i - 1]])
      ]);
      row.appendChild(btn);
    })(i);
  }
  return row;
}

function render(){
  var root = document.getElementById("root");
  root.innerHTML = "";

  if (window.location.search.indexOf("painel") !== -1){
    renderPainel(root);
    return;
  }

  root.appendChild(el("div", { class: "topbar" }, [
    el("h2", {}, ["🎉 Avaliação da Festa Julina 2026"]),
    el("p", {}, ["EM Regina Celi da Silva Cerdeira — preenchimento da equipe"]),
    el("a", { class: "accounts-link", href: PRESTACAO_CONTAS_URL, target: "_blank", rel: "noopener" },
      ["📊 Ver Resumo Geral (PDF)"])
  ]));

  if (!state.submitted){
    var pct = Math.round((state.step / (TOTAL_STEPS - 1)) * 100);
    var pw = el("div", { class: "progress-wrap" }, [
      el("div", { class: "progress-track" }, [
        el("div", { class: "progress-fill", style: "width:" + pct + "%" })
      ]),
      el("p", { class: "progress-label" }, ["Etapa " + (state.step + 1) + " de " + TOTAL_STEPS])
    ]);
    root.appendChild(pw);
  }

  var wrap = el("div", { class: "wrap" });
  root.appendChild(wrap);

  if (state.submitted){
    wrap.appendChild(el("div", { class: "card success-screen" }, [
      el("div", { class: "check" }, ["✅"]),
      el("h2", {}, ["Avaliação enviada!"]),
      el("p", {}, ["Muito obrigado por avaliar a Festa Julina 2026. Sua contribuição ajuda a tornar o próximo evento ainda melhor."])
    ]));
    return;
  }

  var steps = [renderStepIdentificacao, renderStepNotaGeral, renderStepAmbientes,
               renderStepHorarios, renderStepInclusao, renderStepOrganizacao,
               renderStepAberto, renderStepRevisao];
  steps[state.step](wrap);
}

function stepHeader(container, title, sub){
  container.appendChild(el("div", { class: "card" }, [
    el("h2", { class: "step-title" }, [title]),
    sub ? el("p", { class: "step-sub" }, [sub]) : null
  ]));
  return container.lastChild;
}

function navButtons(container, opts){
  opts = opts || {};
  var row = el("div", { class: "btn-row" });
  if (state.step > 0){
    row.appendChild(el("button", {
      class: "nav-btn btn-secondary",
      onclick: function(){ state.step--; render(); }
    }, ["← Voltar"]));
  }
  row.appendChild(el("button", {
    class: "nav-btn btn-primary",
    disabled: opts.disabled ? "disabled" : null,
    onclick: opts.onNext
  }, [opts.label || "Continuar →"]));
  container.appendChild(row);
  return row;
}

// ---- Etapa 0: Identificação ----
function renderStepIdentificacao(wrap){
  var card = stepHeader(wrap, "👋 Identificação",
    "Preencha seus dados. A identificação é obrigatória para validarmos as avaliações recebidas.");

  card.appendChild(el("label", { class: "field-label" }, ["Nome completo ", el("span", { class: "required-mark" }, ["*"])]));
  var nomeInput = el("input", { type: "text", placeholder: "Digite seu nome completo", value: state.data.nome });
  nomeInput.addEventListener("input", function(e){ state.data.nome = e.target.value; });
  card.appendChild(nomeInput);

  card.appendChild(el("label", { class: "field-label" }, ["Função / Cargo ", el("span", { class: "required-mark" }, ["*"])]));
  var funcSelect = el("select", {});
  funcSelect.appendChild(el("option", { value: "" }, ["Selecione..."]));
  FUNCOES.forEach(function(f){
    var opt = el("option", { value: f }, [f]);
    if (state.data.funcao === f) opt.setAttribute("selected", "selected");
    funcSelect.appendChild(opt);
  });
  funcSelect.addEventListener("change", function(e){ state.data.funcao = e.target.value; });
  card.appendChild(funcSelect);

  card.appendChild(el("label", { class: "field-label" }, ["Turma / setor em que atuou no dia (opcional)"]));
  var turmaInput = el("input", { type: "text", placeholder: "Ex.: Turma 301, Portaria, Cozinha...", value: state.data.turma_setor });
  turmaInput.addEventListener("input", function(e){ state.data.turma_setor = e.target.value; });
  card.appendChild(turmaInput);

  var err = el("p", { class: "error-msg" }, ["Por favor, preencha nome e função antes de continuar."]);
  card.appendChild(err);

  navButtons(card, {
    onNext: function(){
      if (!state.data.nome.trim() || !state.data.funcao){
        err.style.display = "block";
        return;
      }
      err.style.display = "none";
      state.step++;
      render();
    }
  });
}

// ---- Etapa 1: Nota geral ----
function renderStepNotaGeral(wrap){
  var card = stepHeader(wrap, "⭐ Avaliação Geral do Evento",
    "De forma geral, como você avalia a Festa Julina 2026?");
  var widgetHolder = el("div", {});
  card.appendChild(widgetHolder);
  function redraw(){
    widgetHolder.innerHTML = "";
    widgetHolder.appendChild(ratingWidget(state.data.nota_geral, function(v){
      state.data.nota_geral = v; redraw();
    }));
  }
  redraw();
  var err = el("p", { class: "error-msg" }, ["Selecione uma nota para continuar."]);
  card.appendChild(err);
  navButtons(card, {
    onNext: function(){
      if (!state.data.nota_geral){ err.style.display = "block"; return; }
      err.style.display = "none";
      state.step++; render();
    }
  });
}

// ---- Etapa 2: Ambientes ----
function renderStepAmbientes(wrap){
  var card = stepHeader(wrap, "📍 Avaliação por Ambiente",
    "A festa foi organizada em 4 ambientes principais, além da Feira do Meio. Avalie cada um:");

  AMBIENTES.forEach(function(a){
    var envCard = el("div", { class: "env-card" });
    envCard.appendChild(el("h3", {}, [a.nome]));
    envCard.appendChild(el("p", { class: "env-desc" }, [a.desc]));
    var widgetHolder = el("div", {});
    envCard.appendChild(widgetHolder);
    function redraw(){
      widgetHolder.innerHTML = "";
      widgetHolder.appendChild(ratingWidget(state.data.ambientes[a.key].nota, function(v){
        state.data.ambientes[a.key].nota = v; redraw();
      }));
    }
    redraw();
    var comentInput = el("textarea", { placeholder: "Comentário sobre este ambiente (opcional)" });
    comentInput.value = state.data.ambientes[a.key].comentario;
    comentInput.addEventListener("input", function(e){ state.data.ambientes[a.key].comentario = e.target.value; });
    envCard.appendChild(el("label", { class: "field-label" }, ["Comentário (opcional)"]));
    envCard.appendChild(comentInput);
    card.appendChild(envCard);
  });

  var err = el("p", { class: "error-msg" }, ["Avalie todos os ambientes para continuar."]);
  card.appendChild(err);

  navButtons(card, {
    onNext: function(){
      var okAll = AMBIENTES.every(function(a){ return state.data.ambientes[a.key].nota > 0; });
      if (!okAll){ err.style.display = "block"; return; }
      err.style.display = "none";
      state.step++; render();
    }
  });
}

// ---- Etapa 3: Horários / cronograma ----
function renderStepHorarios(wrap){
  var card = stepHeader(wrap, "🕐 Cronograma por Faixa de Horário",
    "O evento foi dividido em três faixas de horário. Avalie a organização de cada uma:");

  HORARIOS.forEach(function(h){
    var envCard = el("div", { class: "env-card" });
    envCard.appendChild(el("h3", {}, [h.label]));
    envCard.appendChild(el("p", { class: "env-desc" }, [h.turmas]));
    var widgetHolder = el("div", {});
    envCard.appendChild(widgetHolder);
    function redraw(){
      widgetHolder.innerHTML = "";
      widgetHolder.appendChild(ratingWidget(state.data.horarios[h.key], function(v){
        state.data.horarios[h.key] = v; redraw();
      }));
    }
    redraw();
    card.appendChild(envCard);
  });

  var err = el("p", { class: "error-msg" }, ["Avalie todas as faixas de horário para continuar."]);
  card.appendChild(err);

  navButtons(card, {
    onNext: function(){
      var okAll = HORARIOS.every(function(h){ return state.data.horarios[h.key] > 0; });
      if (!okAll){ err.style.display = "block"; return; }
      err.style.display = "none";
      state.step++; render();
    }
  });
}

// ---- Etapa 4: Inclusão e acessibilidade ----
function renderStepInclusao(wrap){
  var card = stepHeader(wrap, "🤝 Inclusão e Acessibilidade",

  var coment = el("textarea", { placeholder: "Observações sobre inclusão e acessibilidade" });
  coment.value = state.data.inclusao_comentario;
  coment.addEventListener("input", function(e){ state.data.inclusao_comentario = e.target.value; });
  card.appendChild(coment);

  var err = el("p", { class: "error-msg" }, ["Selecione uma nota para continuar."]);
  card.appendChild(err);
  navButtons(card, {
    onNext: function(){
      if (!state.data.inclusao_nota){ err.style.display = "block"; return; }
      err.style.display = "none";
      state.step++; render();
    }
  });
}

// ---- Etapa 5: Organização e comunicação ----
function renderStepOrganizacao(wrap){
  var card = stepHeader(wrap, "🗂️ Organização Geral e Comunicação da Equipe",
    "Avalie a organização geral (staff, postos de trabalho, cronograma) e a comunicação entre a equipe (rádio/WhatsApp, coordenação central).");

  card.appendChild(el("label", { class: "field-label" }, ["Organização geral do evento"]));
  var w1 = el("div", {}); card.appendChild(w1);
  function redraw1(){
    w1.innerHTML = "";
    w1.appendChild(ratingWidget(state.data.organizacao_nota, function(v){
      state.data.organizacao_nota = v; redraw1();
    }));
  }
  redraw1();

  card.appendChild(el("label", { class: "field-label" }, ["Comunicação entre a equipe durante o evento"]));
  var w2 = el("div", {}); card.appendChild(w2);
  function redraw2(){
    w2.innerHTML = "";
    w2.appendChild(ratingWidget(state.data.comunicacao_nota, function(v){
      state.data.comunicacao_nota = v; redraw2();
    }));
  }
  redraw2();

  var err = el("p", { class: "error-msg" }, ["Avalie os dois itens para continuar."]);
  card.appendChild(err);
  navButtons(card, {
    onNext: function(){
      if (!state.data.organizacao_nota || !state.data.comunicacao_nota){ err.style.display = "block"; return; }
      err.style.display = "none";
      state.step++; render();
    }
  });
}

// ---- Etapa 6: Feedback aberto ----
function renderStepAberto(wrap){
  var card = stepHeader(wrap, "💬 Feedback Aberto",
    "Compartilhe sua percepção livremente. Todos os campos são opcionais.");

  card.appendChild(el("label", { class: "field-label" }, ["✅ Pontos positivos"]));
  var t1 = el("textarea", { placeholder: "O que funcionou bem?" });
  t1.value = state.data.pontos_positivos;
  t1.addEventListener("input", function(e){ state.data.pontos_positivos = e.target.value; });
  card.appendChild(t1);

  card.appendChild(el("label", { class: "field-label" }, ["⚠️ Pontos a melhorar"]));
  var t2 = el("textarea", { placeholder: "O que pode ser melhorado?" });
  t2.value = state.data.pontos_melhorar;
  t2.addEventListener("input", function(e){ state.data.pontos_melhorar = e.target.value; });
  card.appendChild(t2);

  card.appendChild(el("label", { class: "field-label" }, ["💡 Sugestões para o próximo evento"]));
  var t3 = el("textarea", { placeholder: "Ideias e sugestões" });
  t3.value = state.data.sugestoes;
  t3.addEventListener("input", function(e){ state.data.sugestoes = e.target.value; });
  card.appendChild(t3);

  navButtons(card, {
    onNext: function(){ state.step++; render(); }
  });
}

// ---- Etapa 7: Revisão e envio ----
function renderStepRevisao(wrap){
  var card = stepHeader(wrap, "📋 Revisão Final",
    "Confira suas respostas antes de enviar.");

  function block(label, value){
    return el("div", { class: "review-block" }, [
      el("div", { class: "rlabel" }, [label]),
      el("div", { class: "rvalue" }, [value || "—"])
    ]);
  }

  card.appendChild(block("Nome", state.data.nome));
  card.appendChild(block("Função", state.data.funcao));
  card.appendChild(block("Turma/Setor", state.data.turma_setor));
  card.appendChild(block("Nota geral do evento", state.data.nota_geral + "/5"));
  AMBIENTES.forEach(function(a){
    card.appendChild(block(a.nome, state.data.ambientes[a.key].nota + "/5" +
      (state.data.ambientes[a.key].comentario ? " — \"" + state.data.ambientes[a.key].comentario + "\"" : "")));
  });
  HORARIOS.forEach(function(h){
    card.appendChild(block("Horário " + h.label, state.data.horarios[h.key] + "/5"));
  });
  card.appendChild(block("Inclusão e acessibilidade", state.data.inclusao_nota + "/5" +
    (state.data.inclusao_comentario ? " — \"" + state.data.inclusao_comentario + "\"" : "")));
  card.appendChild(block("Organização geral", state.data.organizacao_nota + "/5"));
  card.appendChild(block("Comunicação da equipe", state.data.comunicacao_nota + "/5"));
  if (state.data.pontos_positivos) card.appendChild(block("Pontos positivos", state.data.pontos_positivos));
  if (state.data.pontos_melhorar) card.appendChild(block("Pontos a melhorar", state.data.pontos_melhorar));
  if (state.data.sugestoes) card.appendChild(block("Sugestões", state.data.sugestoes));

  if (state.submitError){
    card.appendChild(el("p", { class: "error-msg", style: "display:block;" }, [state.submitError]));
  }

  navButtons(card, {
    label: state.submitting ? "Enviando..." : "✅ Enviar Avaliação",
    disabled: state.submitting,
    onNext: submitForm
  });
}

function submitForm(){
  if (state.submitting) return;
  state.submitting = true;
  state.submitError = "";
  render();

  var payload = {
    nome: state.data.nome.trim(),
    funcao: state.data.funcao,
    turma_setor: state.data.turma_setor.trim() || null,
    nota_geral: state.data.nota_geral,
    quadra_nota: state.data.ambientes.quadra.nota,
    quadra_comentario: state.data.ambientes.quadra.comentario || null,
    estacionamento_nota: state.data.ambientes.estacionamento.nota,
    estacionamento_comentario: state.data.ambientes.estacionamento.comentario || null,
    parquinho_nota: state.data.ambientes.parquinho.nota,
    parquinho_comentario: state.data.ambientes.parquinho.comentario || null,
    auditorio_nota: state.data.ambientes.auditorio.nota,
    auditorio_comentario: state.data.ambientes.auditorio.comentario || null,
    feira_meio_nota: state.data.ambientes.feira_meio.nota,
    feira_meio_comentario: state.data.ambientes.feira_meio.comentario || null,
    horario1_nota: state.data.horarios.horario1,
    horario2_nota: state.data.horarios.horario2,
    horario3_nota: state.data.horarios.horario3,
    inclusao_nota: state.data.inclusao_nota,
    inclusao_comentario: state.data.inclusao_comentario || null,
    organizacao_nota: state.data.organizacao_nota,
    comunicacao_nota: state.data.comunicacao_nota,
    pontos_positivos: state.data.pontos_positivos || null,
    pontos_melhorar: state.data.pontos_melhorar || null,
    sugestoes: state.data.sugestoes || null
  };

  sbClient.from(TABLE_NAME).insert([payload]).then(function(res){
    state.submitting = false;
    if (res.error){
      state.submitError = "Erro ao enviar: " + res.error.message + ". Tente novamente.";
      render();
    } else {
      state.submitted = true;
      render();
    }
  }).catch(function(e){
    state.submitting = false;
    state.submitError = "Erro de conexão. Verifique a internet e tente novamente.";
    render();
  });
}

// =========================================================================
// PAINEL DA EQUIPE DIRETIVA (?painel)
// =========================================================================
var painelState = { authed: false, loading: false, rows: [], error: "" };

function renderPainel(root){
  if (!painelState.authed){
    var card = el("div", { class: "painel-login card" }, [
      el("h2", { class: "step-title" }, ["🔒 Painel da Equipe Diretiva"]),
      el("p", { class: "step-sub" }, ["Digite a chave de acesso para visualizar as avaliações."])
    ]);
    var pass = el("input", { type: "password", placeholder: "Chave de acesso" });
    card.appendChild(pass);
    var err = el("p", { class: "error-msg" }, ["Chave incorreta."]);
    card.appendChild(err);
    var btn = el("button", {
      class: "nav-btn btn-primary", style: "margin-top:14px;width:100%;",
      onclick: function(){
        if (pass.value === PAINEL_SENHA){
          painelState.authed = true;
          loadPainelData();
          render();
        } else {
          err.style.display = "block";
        }
      }
    }, ["Entrar"]);
    card.appendChild(btn);
    var wrap = el("div", { class: "wrap" }, [card]);
    root.appendChild(el("div", { class: "topbar" }, [
      el("h2", {}, ["🎉 Avaliação da Festa Julina 2026"]),
      el("a", { class: "accounts-link", href: PRESTACAO_CONTAS_URL, target: "_blank", rel: "noopener" },
        ["📊 Ver Resumo Geral (PDF)"])
    ]));
    root.appendChild(wrap);
    return;
  }

  root.appendChild(el("div", { class: "topbar" }, [
    el("h2", {}, ["📊 Painel — Avaliação da Festa Julina 2026"]),
    el("a", { class: "accounts-link", href: PRESTACAO_CONTAS_URL, target: "_blank", rel: "noopener" },
      ["📊 Ver Resumo Geral (PDF)"])
  ]));
  var pw = el("div", { class: "painel-wrap" });
  root.appendChild(pw);

  if (painelState.loading){
    pw.appendChild(el("div", { class: "loading-screen" }, ["Carregando respostas..."]));
    return;
  }
  if (painelState.error){
    pw.appendChild(el("div", { class: "loading-screen" }, [painelState.error]));
    return;
  }

  var rows = painelState.rows;
  pw.appendChild(el("button", { class: "export-btn", onclick: exportCSV }, ["⬇️ Exportar CSV"]));

  function avg(field){
    if (!rows.length) return "—";
    var s = 0;
    rows.forEach(function(r){ s += (r[field] || 0); });
    return (s / rows.length).toFixed(1);
  }

  var kpis = el("div", { class: "kpi-grid" }, [
    kpiBox(rows.length, "Respostas recebidas"),
    kpiBox(avg("nota_geral"), "Nota geral média"),
    kpiBox(avg("quadra_nota"), "Quadra (média)"),
    kpiBox(avg("estacionamento_nota"), "Estacionamento (média)"),
    kpiBox(avg("parquinho_nota"), "Parquinho (média)"),
    kpiBox(avg("auditorio_nota"), "Auditório (média)"),
    kpiBox(avg("feira_meio_nota"), "Feira do Meio (média)"),
    kpiBox(avg("inclusao_nota"), "Inclusão (média)"),
    kpiBox(avg("organizacao_nota"), "Organização (média)"),
    kpiBox(avg("comunicacao_nota"), "Comunicação (média)")
  ]);
  pw.appendChild(kpis);

  var scroll = el("div", { class: "table-scroll" });
  var table = el("table", { class: "resp-table" });
  var thead = el("thead", {}, [el("tr", {}, [
    "Data", "Nome", "Função", "Turma/Setor", "Geral", "Quadra", "Estac.", "Parq.", "Audit.",
    "Feira", "10-12h", "12-14h", "14-15h30", "Inclusão", "Organiz.", "Comunic.", "Comentários"
  ].map(function(t){ return el("th", {}, [t]); }))]);
  table.appendChild(thead);
  var tbody = el("tbody", {});
  rows.forEach(function(r){
    var comentarios = [
      r.quadra_comentario ? "Quadra: " + r.quadra_comentario : null,
      r.estacionamento_comentario ? "Estac.: " + r.estacionamento_comentario : null,
      r.parquinho_comentario ? "Parq.: " + r.parquinho_comentario : null,
      r.auditorio_comentario ? "Audit.: " + r.auditorio_comentario : null,
      r.feira_meio_comentario ? "Feira: " + r.feira_meio_comentario : null,
      r.inclusao_comentario ? "Inclusão: " + r.inclusao_comentario : null,
      r.pontos_positivos ? "Positivos: " + r.pontos_positivos : null,
      r.pontos_melhorar ? "Melhorar: " + r.pontos_melhorar : null,
      r.sugestoes ? "Sugestões: " + r.sugestoes : null
    ].filter(Boolean).join(" | ");
    var tr = el("tr", {}, [
      el("td", {}, [new Date(r.created_at).toLocaleString("pt-BR")]),
      el("td", {}, [r.nome]),
      el("td", {}, [r.funcao]),
      el("td", {}, [r.turma_setor || "—"]),
      el("td", {}, [badge(r.nota_geral)]),
      el("td", {}, [badge(r.quadra_nota)]),
      el("td", {}, [badge(r.estacionamento_nota)]),
      el("td", {}, [badge(r.parquinho_nota)]),
      el("td", {}, [badge(r.auditorio_nota)]),
      el("td", {}, [badge(r.feira_meio_nota)]),
      el("td", {}, [badge(r.horario1_nota)]),
      el("td", {}, [badge(r.horario2_nota)]),
      el("td", {}, [badge(r.horario3_nota)]),
      el("td", {}, [badge(r.inclusao_nota)]),
      el("td", {}, [badge(r.organizacao_nota)]),
      el("td", {}, [badge(r.comunicacao_nota)]),
      el("td", { class: "comment-cell" }, [comentarios || "—"])
    ]);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  pw.appendChild(scroll);
}

function kpiBox(num, label){
  return el("div", { class: "kpi" }, [
    el("div", { class: "kpi-num" }, [String(num)]),
    el("div", { class: "kpi-label" }, [label])
  ]);
}

function badge(n){
  return el("span", { class: "badge badge-" + n }, [String(n)]);
}

function loadPainelData(){
  painelState.loading = true;
  painelState.error = "";
  render();
  sbClient.from(TABLE_NAME).select("*").order("created_at", { ascending: false }).then(function(res){
    painelState.loading = false;
    if (res.error){
      painelState.error = "Erro ao carregar dados: " + res.error.message;
    } else {
      painelState.rows = res.data || [];
    }
    render();
  }).catch(function(e){
    painelState.loading = false;
    painelState.error = "Erro de conexão ao carregar os dados.";
    render();
  });
}

function exportCSV(){
  var rows = painelState.rows;
  if (!rows.length) return;
  var cols = Object.keys(rows[0]);
  var csv = cols.join(";") + "\n";
  rows.forEach(function(r){
    csv += cols.map(function(c){
      var v = r[c] == null ? "" : String(r[c]).replace(/"/g, '""').replace(/\n/g, " ");
      return '"' + v + '"';
    }).join(";") + "\n";
  });
  var blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "avaliacao_festa_junina_2026.csv";
  a.click();
}

  waitForSupabaseGlobal(function(){

  });
